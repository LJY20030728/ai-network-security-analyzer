name: CI

# 持续集成 / 持续交付流水线
# - test-linux:   Ubuntu 上跑全量单测（Python 3.11 + 3.13 矩阵）
# - test-windows: Windows 上跑同一套单测。必须保留：核心安全能力 DPAPI
#                 加密（src/security/secure_store.py）是 Windows-only，
#                 Linux 上相关分支会被跳过，只在 Linux 跑会漏掉真实缺陷。
# - build:        两个测试 job 全绿后 PyInstaller 打包 + Inno Setup 生成安装包
# 手动触发：仓库 Actions 页 → "Run workflow"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-linux:
    name: 测试(Linux) · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装依赖（锁定版本，保证可复现）
        run: pip install -r requirements.lock
      - name: 运行测试
        run: pytest tests -q
      - name: 安全回归门禁（图表转义 / 名称校验 / 路由可达性 / gradio 可选性）
        # 这组测试锁定四个已确认缺陷，防止回归：
        #   1. 基线名存储型 XSS（恶意名穿透 gr.HTML）
        #   2. 基线名称校验（写入层单一入口）
        #   3. /api/forensic/related|iocs 路径参数退化为字面花括号 → 404
        #   4. 无 gradio 时模块级 gr.themes 访问导致整个 API 导入失败
        run: pytest tests/test_charts.py -q

  test-windows:
    name: 测试(Windows/DPAPI) · Python 3.11
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖（锁定版本，保证可复现）
        run: pip install -r requirements.lock
      - name: 运行测试（覆盖 DPAPI 等 Windows-only 分支）
        run: pytest tests -q

  build:
    name: 打包 · PyInstaller + Inno Setup
    runs-on: windows-latest
    needs: [test-linux, test-windows]
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Python 3.11（与开发/测试环境一致）
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 创建 venv 并安装依赖（含 PyInstaller）
        shell: cmd
        run: |
          python -m venv venv
          venv\Scripts\python.exe -m pip install --upgrade pip
          venv\Scripts\python.exe -m pip install -r requirements.lock pyinstaller
      - name: 下载 BGE ONNX Embedding 模型（~91MB，打包必需）
        shell: cmd
        run: |
          if not exist models\bge-small-zh-v1.5 mkdir models\bge-small-zh-v1.5
          curl -L -o models\bge-small-zh-v1.5\model.onnx "https://hf-mirror.com/Xenova/bge-small-zh-v1.5/resolve/main/onnx/model.onnx"
          curl -L -o models\bge-small-zh-v1.5\tokenizer.json "https://hf-mirror.com/Xenova/bge-small-zh-v1.5/resolve/main/tokenizer.json"
      - name: PyInstaller 打包（约 10-30 分钟）
        shell: cmd
        run: build_exe.bat < nul
      - name: 安装 Inno Setup 6
        run: choco install innosetup -y --no-progress
      - name: 生成安装包
        shell: cmd
        run: 制作安装程序.bat < nul
      - name: 上传安装包（14 天可下载）
        uses: actions/upload-artifact@v4
        with:
          name: AI网络安全智能分析系统-Setup
          path: installer_output/*.exe
          retention-days: 14
